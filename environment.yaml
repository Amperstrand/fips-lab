targets:
  macbook-local:
    drivers:
      - LocalShellDriver: {}
      - FipsServiceDriver:
          service_kind: launchd
          label: com.fips.daemon
          config_path: /usr/local/etc/fips/fips.yaml
      - FipsctlDriver:
          binary: /Users/macbook/src/fips/target/release/fipsctl
          sudo: true
      - FipsStrategy: {}

  ai-legion-small:
    resources:
      - NetworkService:
          address: "ai-legion-small"
          username: ubuntu
    drivers:
      - SSHDriver: {}
      - FipsServiceDriver:
          service_kind: systemd
          service_name: fips
          config_path: /etc/fips/fips.yaml
          ble_adapter: hci0
      - FipsctlDriver:
          # Pinned bench daemon: built from the amperstrand/lab-keylog
          # worktree at /home/ubuntu/bench/fips-daemon (SHA recorded in
          # /home/ubuntu/bench/fips-daemon/DAEMON_BUILD), so bench runs stop
          # depending on whatever branch the dev checkout is on and pick up
          # the BLE learned-address-type fix + FIPS_LAB_KEYLOG.
          binary: /home/ubuntu/bench/fips-daemon/target/release/fipsctl
          sudo: true
      - BLEScanDriver:
          adapter: hci0
      - FipsStrategy: {}

  esp32-d0wd-01:
    resources:
      - NetworkService:
          address: "ai-legion"
          username: ubuntu
    drivers:
      - SSHDriver: {}
      - EspFlashDriver:
          tool: esptool
          chip: esp32
          serial_port: /dev/ttyUSB0
          baud: 921600
      - EspSerialDriver:
          serial_port: /dev/ttyUSB0
          baud: 115200
