targets:
  macbook-local:
    drivers:
      - LocalShellDriver: {}
      - FipsServiceDriver:
          service_kind: launchd
          label: com.fips.daemon
          config_path: /usr/local/etc/fips/fips.yaml
      - FipsctlDriver:
          binary: /Users/macbook/src/fips/target/release/fipsctl
          sudo: true
      - FipsStrategy: {}

  ai-legion-small:
    resources:
      - NetworkService:
          address: "ai-legion-small"
          username: ubuntu
    drivers:
      - SSHDriver: {}
      - FipsServiceDriver:
          service_kind: systemd
          service_name: fips
          config_path: /etc/fips/fips.yaml
          ble_adapter: hci0
      - FipsctlDriver:
          # Pinned bench daemon: built from the amperstrand/lab-keylog
          # Provenance-stamped stable deploy (issue #13): the
          # amperstrand/lab-ble daemon line, built in a worktree and
          # deployed to /opt/bench/fips-lab-ble/<git-sha>/ — the binary
          # self-reports its rev (fipsctl --version). NEVER point this
          # at /home/ubuntu/src/fips (read-only upstream reference;
          # building there silently refreshes the system daemon).
          binary: /opt/bench/fips-lab-ble/11b7855ebe/fipsctl
          sudo: true
      - BLEScanDriver:
          adapter: hci0
      - FipsStrategy: {}

  esp32-d0wd-01:
    resources:
      - NetworkService:
          address: "ai-legion"
          username: ubuntu
    drivers:
      - SSHDriver: {}
      - EspFlashDriver:
          tool: esptool
          chip: esp32
          serial_port: /dev/ttyUSB0
          baud: 921600
      - EspSerialDriver:
          serial_port: /dev/ttyUSB0
          baud: 115200
