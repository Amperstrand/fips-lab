# Bench board registry — the hardware safety contract.
# (Pattern ported from bolty-rs tools/hil/hil/cards.toml — see the
# Bench Testing Playbook pattern #9.)
#
# Any board NOT listed here (or listed without the required op) is REFUSED
# for that operation. Serial is the USB serial number (on Espressif
# USB-JTAG it IS the MAC). ops:
#   flash    = may be flashed with test firmware (destructive)
#   observe  = console-tap only (never flashed by scenarios)
#
# Boards deliberately NOT listed (refused for every op):
#   (none currently — the former Hades2001 refusal note is superseded by
#    the m5stick-nucula entry below, owner direction 2026-09-12)
#   - ACR1252 NFC reader (072f:223b) — bench shared device, not a board
#   - any board that appears on the bench without an entry here

[boards."F4:12:FA:CF:03:84"]
alias  = "s3-lab"
chip   = "esp32s3"
ops    = ["flash", "observe"]
notes  = "G*9 lab identity, USB-JTAG"

[boards."cc:8d:a2:2c:91:98"]
alias  = "walter-1"
chip   = "esp32s3"
ops    = ["flash", "observe"]
notes  = "G*5 (esp32s3), USB-JTAG; requires DEVICE_NSEC override"

[boards."cc:8d:a2:2c:94:08"]
alias  = "walter-2"
chip   = "esp32s3"
ops    = ["flash", "observe"]
notes  = "G*7 (esp32s3b), USB-JTAG; requires DEVICE_NSEC override"

[boards."stm32f469i-disco"]
alias  = "f469-mcu"
chip   = "stm32f469"
ops    = ["flash", "observe"]
notes  = "USB CDC c0de:cafe; flash via st-flash (never probe-rs live)"

[boards."81528A13B6"]
alias  = "atom-a"
chip   = "esp32"
ops    = ["flash", "observe"]
notes  = "M5 ATOM Matrix, G*11 lab identity, FTDI 0403:6001 (shared VID:PID with the off-limits M5 Stack — always pass the serial). CHARGERS F+G since 2026-09-13: Rust atom-relay profile (dual relay G26/G32 + Fleet Countdown matrix). Brownout history: 2026-09-06 gateway-class binary reboot-looped under WiFi-association TX; RE-TESTED 2026-09-13 with station-class charger firmware — clean (no brownout through association, 167KB heap). Gateway-class caveat stands for gateway binaries only"

[boards."9D529068B4"]
alias  = "atom-b"
chip   = "esp32"
ops    = ["flash", "observe"]
notes  = "M5 ATOM Matrix, G*12 lab identity, FTDI 0403:6001. CHARGER D since 2026-09-13: Rust atom-matrix profile (metered), Angle Unit pot on Grove G32 (rail-to-rail 0..4095). Lives on the maintainer's Mac; flash via tollgate-lab (bench lock + this registry + serial-matched port), esptool-direct at 115200 ONLY (FT232R dies at the 230400 baud switch). History: SeedKeeper CCID/NFC era, ACR1252 cross-testing (2026-09-03), C++ charger-display prototype (retired)"

# Registry key is SYNTHETIC: the CYD's CH340 adapter exposes no USB serial
# number — identity is the physical port (id_path). If the board moves to a
# different USB socket, update id_path in hil/devices.py + the exporter
# token, or detection silently pins the wrong/no device.
[boards."cyd-ch340"]
alias  = "cyd"
chip   = "esp32"
ops    = ["flash", "observe"]
notes  = "ESP32-D0WD-V3 LCD board, CH340 1a86:7523, no USB serial — pinned by /dev/serial/by-path; G*10 lab identity (device-registry.json 'cyd')"

# Enrolled 2026-09-04 (bench-enrollment bundle). Another project's board:
# their firmware, their flashes (st-flash, same toolchain as f469-mcu);
# FIPS scenarios observe only. Their sessions take BenchLock
# ('amperstrand-bench') — see checklists/bench-enrollment.md in
# hackathon-tooling. State place: microfips-micronuts-wallet.
[boards."F4691"]
alias  = "micronuts-wallet"
chip   = "stm32f469"
ops    = ["flash", "observe"]
notes  = "Micronuts Cashu hardware wallet, CDC-ACM 16c0:27dd (ttyACM2); FIPS-sidecar ADR binds the integration — coordinate with the micronuts session before flashing"

[boards."49D6163EBE"]
alias  = "m5stick-nucula"
chip   = "esp32"
ops    = ["flash", "observe"]
notes  = "M5StickC Plus (Hades2001 USB-serial bridge, FTDI 0403:6001 — shared VID:PID class: always match the USB serial). Back on the bench 2026-09-12 by owner direction as the nucula RC522 relay-rig board (MFRC522 on I2C 0x28, antenna back-to-back with the ACR1252); supersedes the 2026-09-03 off-bench/evmap-relay note for this serial. The bridge flakes above 115200 baud — flash with esptool at -b 115200 (nucula AGENTS). AXP192 keeps the Grove rail up across resets (RC522 latch-up recovery is firmware-side)"
