[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_functions = test_*
markers =
    smoke: quick sanity check (~30s)
    handshake: handshake-specific tests (~1min)
    heartbeat: heartbeat verification (~2min)
    recovery: FIPS restart recovery (~3min)
    stability: long-running stability (5min+)
    slow: any test taking more than 60s
    hardware: requires physical hardware (ESP32, router, etc.)
    benchmark: BLE performance benchmark tests
    ci: suitable for automated CI pipeline
    flash: includes firmware flashing (destructive — reflashes device)
addopts = -v --tb=short --timeout=600 --timeout-method=thread
